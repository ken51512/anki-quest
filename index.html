<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<title>暗記クエスト</title>
<style>
:root{--gold:#ffd166;--muted:#a9b6cc;--text:#f8fafc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at top,#1c3155,#0b1020 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:18px 15px 50px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{background:#263654;border-radius:999px;padding:8px 11px;font-weight:900}
h1{font-size:27px;margin:20px 0 5px} h2{margin:0 0 12px}
.sub,.tiny{color:var(--muted)}
.card{background:linear-gradient(145deg,#18233b,#131d32);border:1px solid #34486d;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 14px 35px #0006}
button{width:100%;border:0;border-radius:16px;padding:15px;margin-top:9px;font-size:17px;font-weight:900;background:#2b4166;color:white}
button.primary{background:var(--gold);color:#172033}
button.back{width:auto;margin:0;padding:8px 12px}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{text-align:left;min-height:145px;margin:0;background:#202e49;border:1px solid #34486d}
.unit .ico{font-size:34px} .unit b{display:block;font-size:16px;margin:6px 0}
.indicator{height:11px;background:#263654;border-radius:20px;overflow:hidden;margin-top:9px}
.bar{height:100%;background:linear-gradient(90deg,#4ade80,#ffd166);transition:.3s}
.pct{font-size:13px;color:var(--muted);margin-top:5px}
.bigArea{font-size:46px;font-weight:900}
.next{font-size:13px;color:#ffd166;margin-top:6px}
.monster{font-size:78px;text-align:center} .monsterName{text-align:center;color:var(--gold);font-size:21px;font-weight:900}
.hp{height:13px;background:#431d2a;border-radius:20px;overflow:hidden} .hpbar{height:100%;background:#fb7185;transition:.3s}
.q{font-size:21px;font-weight:900;line-height:1.45;margin:15px 0} .choice{text-align:left}
.feedback{padding:12px;border-radius:13px;margin-top:12px;font-weight:900} .good{background:#164e3b} .wrong{background:#5b2331}
.center{text-align:center} .score{font-size:58px;font-weight:900} .battle{font-size:32px;color:var(--gold);font-weight:900}
.rank{font-size:45px} .rankname{font-size:22px;color:var(--gold);font-weight:900}
.progress{height:12px;background:#263654;border-radius:20px;overflow:hidden;margin:12px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px} .stat{background:#22304d;padding:11px;border-radius:14px;text-align:center} .big{font-size:22px;font-weight:900}
.fieldCard{background:#202e49;border:1px solid #34486d;border-radius:15px;padding:12px}
.kingdomBar{margin:8px 0 14px}
</style>
</head>
<body><div class="wrap">

<section id="world">
<div class="top"><div class="pill">⚔️ 暗記クエスト</div><div class="pill">試作版 v4.6</div></div>
<h1>知識王国マップ</h1><div class="sub">支配地域を広げて、知識の領土を奪え。</div>

<div class="card">
<h2>🔬 理科王国</h2>
<div class="tiny">王国制覇率 <span id="scienceRate">0%</span></div>
<div class="indicator kingdomBar"><div class="bar" id="scienceBar"></div></div>
<div class="grid" id="science"></div>
</div>

<div class="card">
<h2>🗾 社会王国</h2>
<div class="tiny">王国制覇率 <span id="socialRate">0%</span></div>
<div class="indicator kingdomBar"><div class="bar" id="socialBar"></div></div>
<div class="grid" id="social"></div>
</div>

<div class="card">
<h2>🧮 算数王国</h2>
<div class="tiny">王国制覇率 <span id="mathRate">0%</span></div>
<div class="indicator kingdomBar"><div class="bar" id="mathBar"></div></div>
<div class="grid" id="math"></div>
</div>

<div class="card">
<h2>📚 国語王国</h2>
<div class="tiny">王国制覇率 <span id="japaneseRate">0%</span></div>
<div class="indicator kingdomBar"><div class="bar" id="japaneseBar"></div></div>
<div class="grid" id="japanese"></div>
</div>

<div class="card" id="defenseCard">
<h2>🛡️ 本日の王国防衛</h2>
<div class="tiny">再侵入は1日最大3地域。苦戦した地域を優先。</div>
<div id="defenseList" style="margin-top:10px"></div>
</div>

<div class="card">
<h2>🏆 討伐記録</h2>
<div class="stats">
<div class="stat">総討伐数<div class="big" id="killTotal">0</div></div>
<div class="stat">防衛討伐<div class="big" id="defenseKills">0</div></div>
</div>
<div id="killBook" class="tiny" style="margin-top:12px;line-height:1.9"></div>
</div>
</section>

<section id="area" class="hidden">
<div class="top"><button class="back" onclick="showWorld()">← 王国</button><div class="pill" id="subjectPill"></div></div>
<h1 id="areaTitle"></h1><div class="sub">小フィールドを攻略して支配率を上げろ。</div>
<div class="card center">
<div class="bigArea" id="areaPct">0%</div>
<div id="areaState"></div>
<div class="progress"><div class="bar" id="areaBar"></div></div>
<div class="next" id="nextGoal"></div>
</div>
<div class="card">
<div id="fieldMap" class="grid"></div>
<button class="primary" id="startBtn">👹 モンスター討伐へ</button><button class="hidden" id="defenseBtn">🛡️ 防衛戦へ</button>
</div>
</section>

<section id="game" class="hidden">
<div class="top"><div>敵 <b id="num"></b></div><div class="pill">🔥 <span id="combo">0</span> COMBO</div></div>
<div class="progress"><div class="bar" id="battleBar"></div></div>
<div class="card">
<div class="monster" id="monster"></div>
<div class="monsterName" id="monsterName"></div>
<div class="hp"><div class="hpbar" id="hp"></div></div>
<p class="tiny" id="mode"></p>
<div class="q" id="question"></div>
<div id="choices"></div>
<div id="feedback"></div>
<button class="primary hidden" id="nextBtn">次の敵へ ▶</button>
</div>
</section>

<section id="result" class="hidden">
<h1 class="center">⚔️ 戦闘結果</h1>
<div class="card center">
<div class="battle" id="battleResult"></div>
<div class="score" id="score"></div>
<div id="abc"></div>
<hr style="border-color:#34486d;margin:20px 0">
<div class="rank" id="rankIcon"></div>
<div class="rankname" id="rankName"></div>
<div class="tiny">この単元での戦士ランク</div>
<div class="stats" style="margin-top:15px">
<div class="stat">前回<div class="big" id="prev"></div></div>
<div class="stat">成長<div class="big" id="delta"></div></div>
</div>
<button class="primary" id="mapBtn">🗺️ 支配マップへ</button>
<button id="retryBtn">⚔️ 再戦</button>
</div>
</section>

</div>

let unitId=null,queue=[],idx=0,correct=0,combo=0,fields={},locked=false,baseCorrect=0,isDefense=false,currentEnemy="";
const $=x=>document.getElementById(x),sh=a=>[...a].sort(()=>Math.random()-.5);

const ENEMY_NAMES=["影のゴーレム","紅蓮ワイバーン","鉄壁オーガ","深淵スライム","黒曜ガーゴイル","雷鳴グリフォン","幻影ナイト","毒牙バジリスク","氷結トロル","暗黒ドラゴン"];
function killStats(){try{return JSON.parse(localStorage.getItem("aq-kills")||'{"total":0,"defense":0,"by":{}}')}catch(e){return {total:0,defense:0,by:{}}}}
function addKill(name,defense){
  let k=killStats(); k.total++; if(defense)k.defense++;
  k.by[name]=(k.by[name]||0)+1; localStorage.setItem("aq-kills",JSON.stringify(k));
}
function renderKills(){
  let k=killStats();
  $("killTotal").textContent=k.total; $("defenseKills").textContent=k.defense;
  let rows=Object.entries(k.by).sort((a,b)=>b[1]-a[1]);
  $("killBook").innerHTML=rows.length?rows.map(([n,c])=>`${n.replace(/^(影の|紅蓮|鉄壁|深淵|黒曜|雷鳴|幻影|毒牙|氷結|暗黒)/,"")}　× ${c}匹`).join("<br>"):"まだ討伐記録なし";
}
function defenseMeta(id){try{return JSON.parse(localStorage.getItem("aq-defense-"+id)||"{}")}catch(e){return {}}}
function saveDefenseMeta(id,m){localStorage.setItem("aq-defense-"+id,JSON.stringify(m))}
function daysSince(iso){return (Date.now()-new Date(iso).getTime())/86400000}
function struggle(id){
  let h=hist(id); if(!h.length)return 0;
  let first100=h.findIndex(r=>r.score===100);
  let attempts=first100<0?h.length:first100+1;
  let avg=h.reduce((a,r)=>a+(100-r.score),0)/h.length;
  return attempts*20+avg;
}
function syncDefense(id){
  if(areaScore(id)!==100)return;
  let h=hist(id),last=h[h.length-1]; if(!last)return;
  let d=defenseMeta(id);
  if(!d.stage && d.stage!==0){d.stage=0;d.baseDate=last.date;saveDefenseMeta(id,d)}
}
function dueDefenseIds(){
  Object.keys(U).forEach(syncDefense);
  let cand=[];
  Object.keys(U).forEach(id=>{
    if(areaScore(id)!==100)return;
    let d=defenseMeta(id), intervals=[1,7,30];
    let stage=Math.min(d.stage||0,2);
    let base=d.baseDate||hist(id).slice(-1)[0]?.date;
    if(base && daysSince(base)>=intervals[stage]) cand.push({id,priority:struggle(id)});
  });
  return cand.sort((a,b)=>b.priority-a.priority).slice(0,3).map(x=>x.id);
}
function renderDefense(){
  let ids=dueDefenseIds();
  $("defenseList").innerHTML=ids.length
    ? ids.map(id=>`<button onclick="openArea('${id}')">⚠️ ${U[id].icon} ${U[id].name} にモンスター出現</button>`).join("")
    : '<div class="tiny">今日は平和です。復習時期が来るとここに最大3地域だけ出現します。</div>';
}


function key(id){return "aq4-"+id}
function hist(id){try{return JSON.parse(localStorage.getItem(key(id))||"[]")}catch(e){return[]}}
function mastery(id){
  let m={};
  hist(id).forEach(r=>Object.entries(r.fields||{}).forEach(([f,s])=>{
    if(m[f]===undefined){
      m[f]=s;
    }else if(s===100){
      // 再討伐でその小フィールドを全問正解したら完全制圧を許可する。
      // 過去の誤答履歴は履歴として残すが、支配率を99%に固定しない。
      m[f]=100;
    }else{
      m[f]=m[f]*0.6+s*0.4;
    }
  }));
  Object.keys(m).forEach(f=>m[f]=Math.round(m[f]));
  return m;
}
function areaScore(id){
  let fs=[...new Set(U[id].facts.map(x=>x[0]))],m=mastery(id);
  return Math.round(fs.reduce((a,f)=>a+(m[f]||0),0)/fs.length);
}
function state(p){return p===0?"未踏":p<40?"侵攻中":p<60?"係争地域":p<80?"優勢":p<100?"支配地域":"完全制圧"}
function nextGoal(p){
  if(p===0) return "最初の1%を奪い取れ";
  if(p<40) return `あと ${40-p}% で「係争地域」`;
  if(p<60) return `あと ${60-p}% で「優勢」`;
  if(p<80) return `あと ${80-p}% で「支配地域」`;
  if(p<100) return `あと ${100-p}% で「完全制圧」`;
  return "🎉 完全制圧達成";
}
function hero(p){return p>=95?["👑","最強の勇者"]:p>=80?["🛡️","勇者"]:p>=60?["⚔️","熟練戦士"]:p>=40?["🪖","モブ兵士"]:["🐣","クソ雑魚"]}
function battle(p){return p>=80?"👑 完勝":p>=60?"🏆 勝ち":p>=40?"⚔️ 引き分け":p>=20?"😵 負け":"💀 ボロ負け"}

function kingdomScore(subject){
  let ids=Object.keys(U).filter(id=>U[id].subject===subject);
  return ids.length?Math.round(ids.reduce((a,id)=>a+areaScore(id),0)/ids.length):0;
}

function renderWorld(){
  ["science","social","math","japanese"].forEach(x=>$(x).innerHTML="");
  let map={"理科":["science","scienceRate","scienceBar"],"社会":["social","socialRate","socialBar"],"算数":["math","mathRate","mathBar"],"国語":["japanese","japaneseRate","japaneseBar"]};
  Object.entries(map).forEach(([s,a])=>{let r=kingdomScore(s);$(a[1]).textContent=r+"%";$(a[2]).style.width=r+"%"});
  let due=new Set(dueDefenseIds());
  Object.entries(U).forEach(([id,u])=>{
    let p=areaScore(id),b=document.createElement("button"),target=map[u.subject][0];
    b.className="unit";
    b.innerHTML=`<div class="ico">${u.icon}</div><b>${u.name}</b>
    ${due.has(id)?'<div class="next">⚠️ モンスター再侵入</div>':''}
    <div class="indicator"><div class="bar" style="width:${p}%"></div></div>
    <div class="pct">支配率 ${p}%｜${state(p)}</div>
    <div class="next">${nextGoal(p)}</div>`;
    b.onclick=()=>openArea(id); $(target).appendChild(b);
  });
  renderDefense(); renderKills();
}

function showWorld(){
  $("area").classList.add("hidden"); $("result").classList.add("hidden"); $("world").classList.remove("hidden");
  renderWorld();
}

function openArea(id){
  unitId=id;
  $("world").classList.add("hidden"); $("result").classList.add("hidden"); $("area").classList.remove("hidden");
  let u=U[id],p=areaScore(id),m=mastery(id);
  let si={"理科":"🔬 ","社会":"🗾 ","算数":"🧮 ","国語":"📚 "};
  $("subjectPill").textContent=(si[u.subject]||"")+" "+u.subject+"王国";
  $("areaTitle").textContent=u.icon+" "+u.name+"エリア";
  $("areaPct").textContent=p+"%";
  $("areaState").textContent=state(p);
  $("areaBar").style.width=p+"%";
  $("nextGoal").textContent=nextGoal(p);
  let fs=[...new Set(u.facts.map(x=>x[0]))];
  $("fieldMap").innerHTML=fs.map(f=>`<div class="fieldCard">
    <b>${f}</b>
    <div class="indicator"><div class="bar" style="width:${m[f]||0}%"></div></div>
    <div class="pct">${m[f]||0}%｜${state(m[f]||0)}</div>
  </div>`).join("");
  $("startBtn").onclick=()=>start(false);
  let due=dueDefenseIds().includes(id);
  $("defenseBtn").classList.toggle("hidden",!due);
  $("defenseBtn").onclick=()=>start(true);
}

function start(defense=false){
  isDefense=defense; idx=correct=combo=baseCorrect=0;fields={};
  let facts=U[unitId].facts.map((x,i)=>({id:i,field:x[0],term:x[1],meaning:x[2],wrong:x[3]}));
  if(defense){
    // 防衛戦は短く5問。過去に弱かったフィールドを優先し、同率ならランダム。
    let m=mastery(unitId);
    facts=sh(facts).sort((a,b)=>(m[a.field]||100)-(m[b.field]||100)).slice(0,5);
  }else facts=sh(facts);
  queue=facts.map((f,i)=>({...f,reverse:U[unitId].subject==="算数"?false:i%2===1}));
  $("area").classList.add("hidden"); $("result").classList.add("hidden"); $("game").classList.remove("hidden");
  showQ();
}


const MATH_PROMPTS={
  units:[
    "1km ＝（　）m","1m ＝（　）cm","1㎡ ＝（　）㎠","1a ＝（　）㎡","1ha ＝（　）a",
    "1L ＝（　）mL","1㎥ ＝（　）L","1kg ＝（　）g","1t ＝（　）kg","1時間 ＝（　）分"
  ],
  formula:[
    "長方形の面積 ＝（　）","正方形の面積 ＝（　）","三角形の面積 ＝（　）","平行四辺形の面積 ＝（　）","台形の面積 ＝（　）",
    "円周 ＝（　）","円の面積 ＝（　）","速さ ＝（　）","道のり ＝（　）","時間 ＝（　）"
  ],
  multiples:[
    "2の倍数の見分け方は？","3の倍数の見分け方は？","4の倍数の見分け方は？","5の倍数の見分け方は？","8の倍数の見分け方は？",
    "9の倍数の見分け方は？","11の倍数の見分け方は？","最小公倍数とは？","最大公約数とは？","素数とは？"
  ],
  ratio:[
    "比べる量 ＝（　）","割合 ＝（　）","もとにする量 ＝（　）","100％ ＝（　）","10％ ＝（　）",
    "1％ ＝（　）","1割 ＝（　）％","1分 ＝（　）％","1厘 ＝（　）％","a:b の比の値 ＝（　）"
  ]
};

const mons=["👹","👺","🧌","🐲","🦂","🦇","🐍","🦖","👻","💀"];

function showQ(){
  locked=false;
  let x=queue[idx];
  $("num").textContent=(idx+1)+" / "+queue.length;
  $("combo").textContent=combo;
  $("battleBar").style.width=Math.round(idx/queue.length*100)+"%";
  $("monster").textContent=mons[idx];
  currentEnemy=ENEMY_NAMES[idx%ENEMY_NAMES.length];
  $("monsterName").textContent=currentEnemy;
  $("hp").style.width="100%";
  const isMath=U[unitId].subject==="算数";
  $("mode").textContent=isMath
    ? (isDefense?"🛡️ 防衛戦｜":"")+"🧠 絶対暗記｜公式・定義・単位"
    : (isDefense?"🛡️ 防衛戦｜":"")+(x.reverse?"🔄 逆方向攻撃｜言葉 → 意味":"🎯 正方向攻撃｜意味 → 言葉");
  if(isMath){
    $("question").textContent=(MATH_PROMPTS[unitId]&&MATH_PROMPTS[unitId][x.id])||`${x.term} ＝（　）`;
  }else{
    $("question").textContent=x.reverse?`「${x.term}」とはどれ？`:x.meaning+"。これは何？";
  }
  let all=U[unitId].facts.map((z,i)=>({id:i,meaning:z[2]}));
  let opts=isMath?[x.meaning,...x.wrong]:(x.reverse?[x.meaning,...sh(all.filter(f=>f.id!==x.id).map(f=>f.meaning)).slice(0,3)]:[x.term,...x.wrong]);
  $("choices").innerHTML="";
  sh(opts).forEach(o=>{
    let b=document.createElement("button"); b.className="choice"; b.textContent=o;
    b.onclick=()=>answer(o); $("choices").appendChild(b);
  });
  $("feedback").innerHTML=""; $("nextBtn").classList.add("hidden");
}

function answer(o){
  if(locked)return; locked=true;
  let x=queue[idx],ans=U[unitId].subject==="算数"?x.meaning:(x.reverse?x.meaning:x.term),ok=o===ans;
  fields[x.field]??={c:0,n:0}; fields[x.field].n++;
  if(ok){
    correct++; if(!x.review) baseCorrect++; combo++; fields[x.field].c++; addKill(currentEnemy,isDefense);
    $("hp").style.width="0";
    $("feedback").className="feedback good";
    $("feedback").textContent="💥 会心の一撃！ モンスター撃破！";
  } else {
    combo=0;
    if(!isDefense && !x.review && queue.length<14){
      const gap=2+Math.floor(Math.random()*3);
      const pos=Math.min(idx+gap,queue.length);
      queue.splice(pos,0,{...x,reverse:U[unitId].subject==="算数"?false:!x.reverse,review:true});
    }
    $("hp").style.width="55%";
    $("feedback").className="feedback wrong";
    $("feedback").innerHTML=`💢 攻撃失敗！<br>正解：${ans}`;
  }
  $("combo").textContent=combo; $("nextBtn").classList.remove("hidden");
}

function finish(){
  let s=Math.round(baseCorrect/(isDefense?5:10)*100),h=hist(unitId),prev=h.length?h[h.length-1].score:null,fs={};
  Object.entries(fields).forEach(([f,x])=>fs[f]=Math.round(x.c/x.n*100));
  h.push({score:s,fields:fs,date:new Date().toISOString()});
  localStorage.setItem(key(unitId),JSON.stringify(h));
  if(isDefense){
    let d=defenseMeta(unitId);
    if(s===100){
      d.stage=Math.min((d.stage||0)+1,2);
      d.baseDate=new Date().toISOString();
    }else{
      // 防衛失敗時だけ実際の支配率へ反映。次回は翌日扱いに戻す。
      d.stage=0; d.baseDate=new Date().toISOString();
    }
    saveDefenseMeta(unitId,d);
  }else if(s===100){
    let d=defenseMeta(unitId);
    if(!d.baseDate){d.stage=0;d.baseDate=new Date().toISOString();saveDefenseMeta(unitId,d)}
  }
  $("game").classList.add("hidden"); $("result").classList.remove("hidden");
  let r=hero(s),d=prev===null?null:s-prev;
  $("battleResult").textContent=battle(s);
  $("score").textContent=s+"%";
  $("abc").textContent="正式ABC判定："+(s>=80?"A":s>=40?"B":"C");
  $("rankIcon").textContent=r[0]; $("rankName").textContent=r[1];
  $("prev").textContent=prev===null?"初回":prev+"%";
  $("delta").textContent=d===null?"—":(d>=0?"+":"")+d+"pt";
}

$("nextBtn").onclick=()=>{idx++;idx>=queue.length?finish():showQ()};
$("mapBtn").onclick=()=>openArea(unitId);
$("retryBtn").onclick=start;
renderWorld();
</script>
</body></html>
