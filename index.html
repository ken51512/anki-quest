<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>暗記クエスト｜大地の変化</title>
<style>
:root{--bg:#0b1020;--card:#17233b;--card2:#22304d;--gold:#ffd166;--ok:#4ade80;--bad:#fb7185;--text:#f8fafc;--muted:#a9b6cc;--line:#34486d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1e355b 0,#0b1020 44%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:540px;margin:auto;padding:16px 15px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#263654;border-radius:999px;padding:8px 11px;font-weight:900;font-size:14px}
h1{font-size:27px;margin:20px 0 4px}.sub,.tiny{color:var(--muted)}.sub{margin-bottom:16px}.card{background:linear-gradient(145deg,#18233b,#131d32);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 14px 35px #0006;margin-bottom:14px}.center{text-align:center}.rank{font-size:48px;text-align:center}.rankname{text-align:center;font-size:23px;font-weight:1000;color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.stat{background:var(--card2);padding:11px;border-radius:14px;text-align:center}.big{font-size:23px;font-weight:1000}.progress{height:12px;background:#263654;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#4ade80,#ffd166);transition:.35s}
button{touch-action:manipulation;width:100%;border:0;border-radius:16px;padding:15px;margin-top:9px;font-size:17px;font-weight:1000;background:#2b4166;color:white;cursor:pointer}button.primary{background:var(--gold);color:#172033}button.choice{text-align:left;min-height:58px}button:active{transform:scale(.99)}.hidden{display:none!important}.map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tile{background:#202e49;border:1px solid var(--line);border-radius:15px;padding:11px}.tile strong{display:block}.tile span{font-size:12px;color:var(--muted)}
.monster{font-size:82px;text-align:center;filter:drop-shadow(0 8px 12px #0008);margin:4px}.monsterName{text-align:center;font-size:20px;font-weight:1000;color:#ffcf70}.hp{height:13px;background:#431d2a;border-radius:20px;overflow:hidden;margin:8px 0 16px}.hpbar{height:100%;background:#fb7185;transition:.35s}.q{font-size:21px;font-weight:900;line-height:1.45;margin:15px 0}.feedback{padding:12px;border-radius:13px;margin-top:12px;font-weight:900}.good{background:#164e3b}.wrong{background:#5b2331}.battleResult{font-size:34px;font-weight:1000;text-align:center;color:var(--gold)}.conquest{font-size:46px;font-weight:1000;text-align:center}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.note{font-size:12px;color:var(--muted);background:#10192b;padding:10px;border-radius:12px;margin-top:10px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#2a3c5f;font-size:12px;font-weight:900;margin:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="pill">⚔️ 暗記クエスト</div><div class="pill">🏰 地学王国</div></div>
<section id="home">
<h1>大地の変化エリア</h1><div class="sub">モンスターを倒して、知識の領土を奪え。</div>
<div class="card center"><div class="rank" id="heroIcon">🐣</div><div class="rankname" id="heroRank">未挑戦</div><div class="stats"><div class="stat">前回<div class="big" id="prev">--%</div></div><div class="stat">自己ベスト<div class="big" id="best">--%</div></div></div><div class="conquest" id="conquest">0%</div><div class="tiny">大地の変化エリア 支配率</div><div class="rankname" id="lordRank">未支配</div><div class="progress"><div class="bar" id="areaBar" style="width:0"></div></div><button class="primary" id="startBtn">👹 モンスター討伐へ</button><button id="resetBtn">戦績をリセット</button></div>
<div class="card"><strong>🗺️ 支配フィールド</strong><div class="map" id="map"></div><div class="note">正式評価は別軸で保存：演習ABC＝C 0–39% / B 40–79% / A 80–100%。ゲーム称号は子ども向けの表示です。</div></div>
</section>
<section id="game" class="hidden"><div class="top"><div>敵 <b id="num">1</b>/10</div><div class="pill">🔥 <span id="combo">0</span> COMBO</div></div><div class="progress"><div class="bar" id="battleBar"></div></div><div class="card"><div class="monster" id="monster">👹</div><div class="monsterName" id="monsterName">侵食オーガ</div><div class="hp"><div class="hpbar" id="hp"></div></div><div class="tiny" id="mode"></div><div class="q" id="question"></div><div id="choices"></div><div id="feedback"></div><button class="primary hidden" id="nextBtn">次の敵へ ▶</button></div></section>
<section id="result" class="hidden"><h1 class="center">⚔️ 戦闘結果</h1><div class="card"><div class="battleResult" id="battleResult"></div><div class="conquest" id="score"></div><div class="center" id="abc"></div><div class="stats"><div class="stat">前回<div class="big" id="rprev"></div></div><div class="stat">成長<div class="big delta" id="delta"></div></div></div><hr><div class="center"><div class="rank" id="resIcon"></div><div class="rankname" id="resHero"></div><div class="tiny">この戦闘での戦士ランク</div></div><div class="stats"><div class="stat">エリア支配率<div class="big" id="resConquest"></div></div><div class="stat">領主ランク<div class="big" id="resLord" style="font-size:16px"></div></div></div><div id="fieldBadges" class="center"></div><div id="message" class="note"></div><button class="primary" id="homeBtn">🗺️ 領土マップへ</button><button id="retryBtn">⚔️ 再戦する</button></div></section>
</div>
<script>
"use strict";
const facts=[
{id:"erosion",field:"流水",term:"侵食",meaning:"流水が地面をけずる働き",wrong:["運搬","堆積","隆起"]},
{id:"transport",field:"流水",term:"運搬",meaning:"流水がれき・砂・泥などを運ぶ働き",wrong:["侵食","堆積","沈降"]},
{id:"deposit",field:"地層",term:"堆積",meaning:"運ばれたものが積もる働き",wrong:["侵食","運搬","しゅう曲"]},
{id:"facies",field:"化石",term:"示相化石",meaning:"地層ができた当時の環境を知る手がかり",wrong:["示準化石","火山灰","断層"]},
{id:"index",field:"化石",term:"示準化石",meaning:"地層ができた年代を知る手がかり",wrong:["示相化石","泥岩","震央"]},
{id:"volcanic",field:"火山",term:"火山岩",meaning:"マグマが地表付近で比較的急に冷えてできる火成岩",wrong:["深成岩","堆積岩","変成岩"]},
{id:"plutonic",field:"火山",term:"深成岩",meaning:"マグマが地下深くでゆっくり冷えてできる火成岩",wrong:["火山岩","砂岩","れき岩"]},
{id:"focus",field:"地震",term:"震源",meaning:"地下で地震が発生した場所",wrong:["震央","震度","震源距離"]},
{id:"epicenter",field:"地震",term:"震央",meaning:"震源の真上にある地表の地点",wrong:["震源","断層","初期微動"]},
{id:"fault",field:"地殻変動",term:"断層",meaning:"地層や岩盤が割れてずれたもの",wrong:["しゅう曲","隆起","堆積"]}
];
const FIELD_LIST=["流水","地層","化石","火山","地震","地殻変動"];
const MONSTERS=["👹","👺","🧌","🐲","🦂","🦇","🐍","🦖","👻","💀"];
const MONSTER_NAMES=["侵食オーガ","運搬ゴブリン","堆積スライム","化石ミミック","年代ゴーレム","火山ドラゴン","深成トロル","震源デーモン","震央ワイバーン","断層キング"];
let queue=[],idx=0,correct=0,combo=0,locked=false,fieldScores={};
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function battleResult(p){if(p>=80)return"👑 完勝";if(p>=60)return"🏆 勝ち";if(p>=40)return"⚔️ 引き分け";if(p>=20)return"😵 負け";return"💀 ボロ負け"}
function heroRank(p){if(p>=95)return["👑","最強の勇者"];if(p>=80)return["🛡️","勇者"];if(p>=60)return["⚔️","熟練戦士"];if(p>=40)return["🪖","モブ兵士"];return["🐣","クソ雑魚"]}
function lordRank(p){if(p>=95)return"👑 覇王";if(p>=80)return"🏰 すげー領主";if(p>=60)return"🛡️ マシな領主";if(p>=40)return"🏚️ モブ領主";return"🪵 カス領主"}
function abc(p){return p>=80?"A":p>=40?"B":"C"}
function getHistory(){try{return JSON.parse(localStorage.getItem("anki-quest-territory-v1")||"[]")}catch(e){return[]}}
function saveHistory(h){try{localStorage.setItem("anki-quest-territory-v1",JSON.stringify(h))}catch(e){}}
function mastery(){const h=getHistory(),r={};h.forEach(run=>Object.entries(run.fields||{}).forEach(([f,s])=>{r[f]=r[f]===undefined?s:Math.round(r[f]*0.6+s*0.4)}));return r}
function areaRate(){const m=mastery();return Math.round(FIELD_LIST.reduce((sum,f)=>sum+(m[f]||0),0)/FIELD_LIST.length)}
function updateHome(){const h=getHistory(),prev=h.length?h[h.length-1].score:null,best=h.length?Math.max(...h.map(x=>x.score)):null,a=areaRate(),r=heroRank(prev??0),m=mastery();$("prev").textContent=prev===null?"--%":prev+"%";$("best").textContent=best===null?"--%":best+"%";$("heroIcon").textContent=prev===null?"🐣":r[0];$("heroRank").textContent=prev===null?"未挑戦":r[1];$("conquest").textContent=a+"%";$("lordRank").textContent=a===0?"未支配":lordRank(a);$("areaBar").style.width=a+"%";$("map").innerHTML=FIELD_LIST.map(f=>{const s=m[f]||0,flag=s>=80?"🏳️‍🌈":s>=40?"🚩":"🏴";return `<div class="tile"><strong>${flag} ${f}</strong><span>支配率 ${s}%</span></div>`}).join("")}
function startGame(){idx=0;correct=0;combo=0;locked=false;fieldScores={};queue=shuffle(facts).map((f,i)=>({...f,reverse:i%2===1}));$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");showQuestion()}
function showQuestion(){locked=false;const q=queue[idx];$("num").textContent=idx+1;$("combo").textContent=combo;$("battleBar").style.width=(idx*10)+"%";$("monster").textContent=MONSTERS[idx];$("monsterName").textContent=MONSTER_NAMES[idx];$("hp").style.width="100%";$("mode").textContent=q.reverse?"🔄 逆方向攻撃｜言葉 → 意味":"🎯 正方向攻撃｜意味 → 言葉";$("question").textContent=q.reverse?`「${q.term}」とはどれ？`:`${q.meaning}。これは何？`;let options;if(q.reverse){const d=shuffle(facts.filter(f=>f.id!==q.id).map(f=>f.meaning)).slice(0,3);options=[q.meaning,...d]}else{options=[q.term,...q.wrong]}$("choices").innerHTML="";shuffle(options).forEach(o=>{const b=document.createElement("button");b.className="choice";b.textContent=o;b.addEventListener("click",()=>answer(o));$("choices").appendChild(b)});$("feedback").innerHTML="";$("nextBtn").classList.add("hidden")}
function answer(selected){if(locked)return;locked=true;const q=queue[idx],correctAnswer=q.reverse?q.meaning:q.term,ok=selected===correctAnswer;if(!fieldScores[q.field])fieldScores[q.field]={c:0,n:0};fieldScores[q.field].n++;if(ok){correct++;combo++;fieldScores[q.field].c++;$("hp").style.width="0%";$("feedback").className="feedback good";$("feedback").textContent="💥 会心の一撃！ モンスター撃破！"}else{combo=0;$("hp").style.width="55%";$("feedback").className="feedback wrong";$("feedback").innerHTML=`💢 攻撃失敗！<br>正解：${correctAnswer}<br><span class="tiny">この敵は復習戦で再登場する。</span>`}$("combo").textContent=combo;$("nextBtn").classList.remove("hidden")}
function nextQuestion(){idx++;idx>=10?finish():showQuestion()}
function finish(){const score=correct*10,h=getHistory(),prev=h.length?h[h.length-1].score:null,fields={};Object.entries(fieldScores).forEach(([f,x])=>fields[f]=Math.round((x.c/x.n)*100));h.push({score,fields,date:new Date().toISOString()});saveHistory(h);$("game").classList.add("hidden");$("result").classList.remove("hidden");const hr=heroRank(score),a=areaRate(),d=prev===null?null:score-prev;$("battleResult").textContent=battleResult(score);$("score").textContent=score+"%";$("abc").textContent="正式ABC判定："+abc(score);$("rprev").textContent=prev===null?"初回":prev+"%";$("delta").textContent=d===null?"—":(d>=0?"+":"")+d+"pt";$("delta").className="big delta "+(d>=0?"up":"down");$("resIcon").textContent=hr[0];$("resHero").textContent=hr[1];$("resConquest").textContent=a+"%";$("resLord").textContent=lordRank(a);$("fieldBadges").innerHTML=Object.entries(fields).map(([f,s])=>`<span class="badge">${f} ${s}%</span>`).join("");$("message").textContent=prev===null?"初戦の戦績を保存。次回から前回の自分との成長差も表示される。":d>0?`前回より${d}ポイント上昇！ 知識領土を拡大した。`:d===0?"前回と互角。逆方向問題と復習戦で突破しよう。":"敵軍が反撃中。弱点フィールドを奪還しよう。"}
function goHome(){$("result").classList.add("hidden");$("home").classList.remove("hidden");updateHome()}
$("startBtn").addEventListener("click",startGame);$("nextBtn").addEventListener("click",nextQuestion);$("retryBtn").addEventListener("click",startGame);$("homeBtn").addEventListener("click",goHome);$("resetBtn").addEventListener("click",()=>{if(confirm("このiPhoneの戦績と支配率をリセットしますか？")){localStorage.removeItem("anki-quest-territory-v1");updateHome()}});updateHome();
</script>
</body>
</html>
